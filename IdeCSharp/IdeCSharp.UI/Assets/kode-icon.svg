<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Dégradé bleu vers violet, utilisé pour le fond -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#7A3FF2"/>
    </linearGradient>
  </defs>

  <!-- Carré aux coins arrondis -->
  <rect width="64" height="64" rx="14" fill="url(#fond)"/>

  <!-- Le symbole </> en blanc, tracé en traits arrondis -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 20 L14 32 L26 44"/>   <!-- chevron gauche < -->
    <path d="M38 20 L50 32 L38 44"/>   <!-- chevron droit > -->
    <path d="M35 16 L29 48"/>          <!-- barre oblique / -->
  </g>
</svg>